<!-- Synthetic clinic intake form: the shapes a real PT/medical practice uses —
     native <label for>, a wrapping label, ARIA labelling, a fieldset+legend
     radio group, a select, a required consent checkbox, a marketing opt-in,
     a honeypot, and a hidden CSRF token. No real clinic's markup. -->
<h1>Request a Consultation</h1>

<form action="/submit" method="post">
  <input type="hidden" name="csrf_token" value="abc123">

  <div class="field">
    <label for="fname">First Name *</label>
    <input type="text" id="fname" name="first_name" required>
  </div>

  <div class="field">
    <label for="lname">Last Name *</label>
    <input type="text" id="lname" name="last_name" required>
  </div>

  <div class="field">
    <label>Email Address *
      <input type="email" name="email" required placeholder="you@example.com">
    </label>
  </div>

  <div class="field">
    <label for="tel">Phone Number *</label>
    <input type="tel" id="tel" name="phone" required>
  </div>

  <div class="field">
    <span id="dob-label">Date of Birth</span>
    <input type="text" name="dob" aria-labelledby="dob-label" placeholder="MM/DD/YYYY">
  </div>

  <div class="field">
    <input type="text" name="insurance" aria-label="Insurance Provider">
  </div>

  <fieldset>
    <legend>Have you been seen at this clinic before?</legend>
    <label><input type="radio" name="returning" value="yes"> Yes</label>
    <label><input type="radio" name="returning" value="no"> No</label>
  </fieldset>

  <div class="field">
    <label for="loc">Preferred Clinic Location</label>
    <select id="loc" name="location">
      <option value="">Select a location</option>
      <option value="pleasanton">Pleasanton</option>
      <option value="dublin">Dublin</option>
      <option value="livermore">Livermore</option>
    </select>
  </div>

  <div class="field">
    <label for="heard">How did you hear about us?</label>
    <select id="heard" name="referral">
      <option value="">Please choose</option>
      <option value="google">Google Search</option>
      <option value="friend">Friend or Family</option>
      <option value="doctor">Doctor Referral</option>
    </select>
  </div>

  <div class="field">
    <label for="reason">What brings you in? *</label>
    <textarea id="reason" name="reason" required maxlength="1000"></textarea>
  </div>

  <div class="field">
    <label><input type="checkbox" name="consent" required> I agree to the privacy policy *</label>
  </div>

  <div class="field">
    <label><input type="checkbox" name="newsletter"> Send me news and special offers</label>
  </div>

  <!-- Honeypot: visually removed, bots fill it, humans never see it. -->
  <div style="position:absolute; left:-9999px;">
    <label for="website">Website</label>
    <input type="text" id="website" name="website">
  </div>

  <button type="submit">Request Appointment</button>
</form>
